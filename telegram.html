<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Telegram Activation | BLACKLORD TECH INC.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.88)), url("https://files.manuscdn.com/user_upload_by_module/session_file/310519663869891013/yUGAUoYFaJBLysNe.jpg") no-repeat center center fixed;
      background-size: cover;
      color: #f3f4f6;
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding-bottom: 3rem;
    }
    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 1rem 0.5rem; background: #000000; position: sticky; top: 0; z-index: 50; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .back-btn { background: #161922; border: 1px solid rgba(250, 204, 21, 0.3); color: #facc15; width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 1.1rem; }
    .topbar-title { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 700; font-style: italic; color: #ffffff; }
    .container { max-width: 600px; margin: 1.5rem auto; padding: 0 1rem; }
    .card { background: #111318; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .card-title { font-size: 1.1rem; font-weight: 700; color: #ffffff; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .card-title i { color: #facc15; }
    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; font-size: 0.8rem; color: #9ca3af; margin-bottom: 0.4rem; font-weight: 600; }
    .form-input, .form-select { width: 100%; background: #161922; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 0.75rem 1rem; color: #ffffff; font-size: 0.95rem; }
    .btn { width: 100%; background: #facc15; color: #000000; font-weight: 700; border: none; border-radius: 10px; padding: 0.85rem; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; text-decoration: none; }
    .toast { display: none; background: #161922; border: 1px solid #22c55e; color: #22c55e; padding: 0.75rem 1rem; border-radius: 10px; margin-top: 1rem; text-align: center; font-weight: 600; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <div class="topbar-title">Telegram Activation</div>
    <div style="width: 42px;"></div>
  </header>
  <main class="container">
    <div class="card">
      <div class="card-title"><i class="fas fa-paper-plane"></i> Generate Telegram Key</div>
      <div class="form-group">
        <label class="form-label">Select Telegram Bot</label>
        <select class="form-select" id="botSelect">
          <option>Blacklord XMD Bot</option>
          <option>Samsung XMD Assistant</option>
          <option>Talkless Ultra Bot</option>
          <option>Skylar XMD Bot</option>
          <option>Rita XMD Bot</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Phone / Account Number</label>
        <input type="text" class="form-input" id="phoneInput" placeholder="Enter phone with country code" autocomplete="tel" inputmode="numeric">
      </div>
      <div class="form-group">
        <label class="form-label">Key Validity</label>
        <select class="form-select" id="validitySelect">
          <option>30 Days Standard</option>
          <option>90 Days Pro</option>
          <option>Lifetime Unlimited</option>
        </select>
      </div>
      <button class="btn" onclick="generateKey()"><i class="fas fa-key"></i> Generate Activation Key</button>
      <div class="toast" id="toast">Activation key generated successfully: BLK-TG-8849-XMD</div>
    </div>
  </main>
  <script>
    function generateKey() {
      const toast = document.getElementById('toast');
      toast.style.display = 'block';
    }
  </script>
</body>
</html>
