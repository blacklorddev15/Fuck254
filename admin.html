<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Control Panel | BLACKLORD TECH INC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(rgba(0,0,0,0.88), rgba(0,0,0,0.92)), url("https://files.manuscdn.com/user_upload_by_module/session_file/310519663869891013/yUGAUoYFaJBLysNe.jpg") no-repeat center center fixed;
      background-size: cover;
      color: #f3f4f6;
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding-bottom: 3rem;
    }
    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 1rem; background: #000000; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .menu-btn { background: #161922; border: 1px solid rgba(250, 204, 21, 0.3); color: #facc15; width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none; }
    .container { max-width: 650px; margin: 1.5rem auto; padding: 0 1rem; }
    .card { background: #111318; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .title { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: #fff; margin-bottom: 0.5rem; font-style: italic; }
    .sub { font-size: 0.75rem; color: #facc15; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 1.5rem; font-weight: 700; }
    .btn { background: #facc15; color: #000; font-weight: 700; border: none; border-radius: 10px; padding: 0.75rem 1rem; cursor: pointer; text-decoration: none; display: inline-block; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header class="topbar">
    <div style="display:flex; align-items:center; gap:0.75rem;">
      <a href="dashboard.html" class="menu-btn"><i class="fas fa-arrow-left"></i></a>
      <div>
        <div style="font-size:0.7rem; color:#facc15; font-weight:700;">ADMIN PRIVILEGES</div>
        <div style="font-family:'Playfair Display',serif; font-size:1.2rem; font-style:italic;">Control Center</div>
      </div>
    </div>
  </header>
  <main class="container">
    <div class="card">
      <div class="sub">PLATFORM OVERVIEW</div>
      <div class="title">System Queue & Workers</div>
      <p style="color:#9ca3af; font-size:0.85rem; margin-bottom:1.25rem;">Monitor live pairing queues, active Pterodactyl containers, bridge status, and system logs.</p>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1.5rem;">
        <div style="background:#161922; padding:1rem; border-radius:12px; border:1px solid rgba(255,255,255,0.08);">
          <div style="font-size:0.7rem; color:#9ca3af; text-transform:uppercase;">Pending Pairing</div>
          <div style="font-size:1.5rem; font-weight:700; color:#facc15;">0 Requests</div>
        </div>
        <div style="background:#161922; padding:1rem; border-radius:12px; border:1px solid rgba(255,255,255,0.08);">
          <div style="font-size:0.7rem; color:#9ca3af; text-transform:uppercase;">Bridge Status</div>
          <div style="font-size:1.5rem; font-weight:700; color:#22c55e;">Online (SLA 99.9%)</div>
        </div>
      </div>
      <button class="btn" onclick="alert('Queue flushed and cache cleared successfully.')">Flush Pending Queue</button>
    </div>
    <div style="text-align:center; font-size:0.75rem; color:#9ca3af; text-transform:uppercase; letter-spacing:1px;">Powered by BLACKLORD TECH INC</div>
  </main>
</body>
</html>
