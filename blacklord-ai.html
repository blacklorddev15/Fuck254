<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BLACKLORD MOVIES - Watch Movies & TV Series | BLACKLORD TECH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.92)), url("https://files.manuscdn.com/user_upload_by_module/session_file/310519663869891013/yUGAUoYFaJBLysNe.jpg") no-repeat center center fixed;
      background-size: cover;
      color: #f3f4f6;
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding-bottom: 3rem;
    }
    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 1rem; background: #000; border-bottom: 1px solid rgba(255,255,255,0.08); position: sticky; top: 0; z-index: 50; }
    .menu-btn { background: #161922; border: 1px solid rgba(250, 204, 21, 0.3); color: #facc15; width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none; }
    .container { max-width: 900px; margin: 1.5rem auto; padding: 0 1rem; }
    .hero-banner { background: #111318; border: 1px solid rgba(34, 197, 94, 0.3); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; text-align: center; }
    .hero-title { font-family: 'Playfair Display', serif; font-size: 1.75rem; font-style: italic; color: #fff; margin-bottom: 0.5rem; }
    .hero-sub { font-size: 0.75rem; color: #22c55e; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; margin-bottom: 1rem; }
    .search-row { display: flex; gap: 0.75rem; margin-top: 1rem; }
    .search-input { flex: 1; background: #161922; border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 0.85rem 1rem; color: #fff; font-size: 0.95rem; }
    .filter-tabs { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
    .tab-btn { background: #161922; border: 1px solid rgba(255,255,255,0.1); color: #9ca3af; padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { background: #22c55e; border-color: #22c55e; color: #000; font-weight: 700; }
    .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .movie-card { background: #111318; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
    .movie-card:hover { transform: translateY(-3px); border-color: rgba(34,197,94,0.5); }
    .movie-poster { width: 100%; height: 220px; background: #161922; object-fit: cover; }
    .movie-info { padding: 0.75rem; display: flex; flex-direction: column; flex: 1; justify-content: space-between; }
    .movie-title { font-weight: 700; font-size: 0.85rem; color: #fff; margin-bottom: 0.25rem; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .movie-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.7rem; color: #9ca3af; margin-bottom: 0.5rem; }
    .rating { color: #facc15; font-weight: 700; }
    .watch-btn { background: #22c55e; border: none; color: #000; width: 100%; border-radius: 8px; padding: 0.5rem; font-size: 0.78rem; font-weight: 700; cursor: pointer; text-align: center; }
    .watch-btn:hover { background: #16a34a; color: #fff; }
    /* Video Player Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 1rem; }
    .modal-card { background: #111318; border: 1px solid rgba(34,197,94,0.4); border-radius: 20px; width: 100%; max-width: 700px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
    .modal-header { padding: 1rem 1.25rem; background: #000; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center; }
    .player-wrap { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; }
    .player-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    .modal-footer { padding: 1.25rem; background: #111318; font-size: 0.88rem; color: #d1d5db; line-height: 1.4; }
  </style>
</head>
<body>
  <header class="topbar">
    <div style="display:flex; align-items:center; gap:0.75rem;">
      <a href="dashboard.html" class="menu-btn"><i class="fas fa-arrow-left"></i></a>
      <div>
        <div style="font-size:0.7rem; color:#22c55e; font-weight:700;">BLACKLORD MOVIES</div>
        <div style="font-family:'Playfair Display',serif; font-size:1.1rem; font-style:italic;">Watch Movies & Shows</div>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="hero-banner">
      <div class="hero-sub">UNLIMITED ENTERTAINMENT STREAMING</div>
      <div class="hero-title">Stream Movies Instantly</div>
      <p style="color:#9ca3af; font-size:0.85rem; margin-bottom:0.75rem;">Select any title below to launch the video player and watch instantly on the website.</p>
      <div class="search-row">
        <input type="text" id="searchInput" class="search-input" placeholder="Search movies, tv series..." oninput="filterCatalog()">
        <button class="watch-btn" style="width:auto; padding:0 1.5rem; background:#facc15; color:#000;" onclick="filterCatalog()">Search</button>
      </div>
    </div>

    <div class="filter-tabs" id="filterTabs">
      <button class="tab-btn active" onclick="setCategory('all', this)">All Titles</button>
      <button class="tab-btn" onclick="setCategory('Trending', this)">Trending Now</button>
      <button class="tab-btn" onclick="setCategory('Sci-Fi', this)">Sci-Fi & Action</button>
      <button class="tab-btn" onclick="setCategory('Drama', this)">Masterclass Drama</button>
      <button class="tab-btn" onclick="setCategory('Anime', this)">Anime Hits</button>
    </div>

    <div class="movie-grid" id="movieGrid">
      <!-- Populated dynamically -->
    </div>
  </main>

  <!-- Video Player Modal -->
  <div class="modal-overlay" id="playerModal" onclick="if(event.target === this) closeModal()">
    <div class="modal-card">
      <div class="modal-header">
        <div style="display:flex; align-items:center; gap:0.5rem;">
          <div style="width:32px; height:32px; background:#22c55e; color:#000; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:700;"><i class="fas fa-play"></i></div>
          <div>
            <div style="font-size:0.65rem; color:#22c55e; text-transform:uppercase;">Now Playing</div>
            <div style="font-weight:700; font-size:1rem;" id="modalTitle">Movie Title</div>
          </div>
        </div>
        <button onclick="closeModal()" style="background:none; border:none; color:#9ca3af; font-size:1.2rem; cursor:pointer;"><i class="fas fa-times"></i></button>
      </div>
      <div class="player-wrap">
        <iframe id="moviePlayer" src="" allowfullscreen></iframe>
      </div>
      <div class="modal-footer" id="modalSummary">
        Loading summary...
      </div>
    </div>
  </div>

  <script>
    let catalog = [
      { id: 1, title: 'Inception', category: 'Sci-Fi', year: 2010, rating: 8.8, poster: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500&auto=format&fit=crop&q=60', summary: 'A thief who steals corporate secrets through the use of dream-sharing technology is given the inverse task of planting an idea.', trailer: 'https://www.youtube.com/embed/YoHD9XEInc0' },
      { id: 2, title: 'Breaking Bad', category: 'Drama', year: 2008, rating: 9.5, poster: 'https://images.unsplash.com/photo-1594909122845-11baa439b7bf?w=500&auto=format&fit=crop&q=60', summary: 'A chemistry teacher diagnosed with inoperable lung cancer turns to manufacturing and selling methamphetamine with a former student.', trailer: 'https://www.youtube.com/embed/HhesaQXLuRY' },
      { id: 3, title: 'Interstellar', category: 'Sci-Fi', year: 2014, rating: 8.7, poster: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=500&auto=format&fit=crop&q=60', summary: 'A team of explorers travel through a wormhole in space in an attempt to ensure humanitys survival.', trailer: 'https://www.youtube.com/embed/zSWdZVtXT7E' },
      { id: 4, title: 'Attack on Titan', category: 'Anime', year: 2013, rating: 9.1, poster: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=500&auto=format&fit=crop&q=60', summary: 'After his hometown is destroyed and is mother is killed, young Eren Jaeger vows to cleanse the earth of the giant humanoid Titans.', trailer: 'https://www.youtube.com/embed/M_OauHnAFcI' },
      { id: 5, title: 'Stranger Things', category: 'Trending', year: 2016, rating: 8.7, poster: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500&auto=format&fit=crop&q=60', summary: 'When a young boy vanishes, a small town uncovers a mystery involving secret experiments, terrifying supernatural forces and one strange little girl.', trailer: 'https://www.youtube.com/embed/b9EkMc79ZSU' },
      { id: 6, title: 'The Dark Knight', category: 'Trending', year: 2008, rating: 9.0, poster: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=500&auto=format&fit=crop&q=60', summary: 'When the menace known as the Joker wreaks havoc and chaos on the people of Gotham, Batman must accept one of the greatest psychological tests.', trailer: 'https://www.youtube.com/embed/EXeTwQWrcwY' },
      { id: 7, title: 'Cyberpunk: Edgerunners', category: 'Anime', year: 2022, rating: 8.3, poster: 'https://images.unsplash.com/photo-1563089145-599997674d42?w=500&auto=format&fit=crop&q=60', summary: 'A street kid trying to survive in a technology and body modification-obsessed city of the future.', trailer: 'https://www.youtube.com/embed/JtqIas3bYhg' },
      { id: 8, title: 'Succession', category: 'Drama', year: 2018, rating: 8.9, poster: 'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=500&auto=format&fit=crop&q=60', summary: 'The Roy family is known for controlling Waystar RoyCo, a massive media and entertainment conglomerate, while questioning their future.', trailer: 'https://www.youtube.com/embed/ozYxZWunqo8' }
    ];

    let currentCategory = 'all';

    async function loadLiveCatalog() {
      try {
        const res = await fetch('/api/user/movies');
        const json = await res.json();
        if (json.success && json.data) {
          const results = json.data.results || json.data.movies || json.data.data;
          if (Array.isArray(results) && results.length > 0) {
            catalog = results.map((item, idx) => ({
              id: item.id || idx + 1,
              title: item.title || item.name || 'Untitled',
              category: item.category || (idx % 2 === 0 ? 'Trending' : 'Sci-Fi'),
              year: item.year || 2024,
              rating: item.rating || 8.5,
              poster: item.poster || item.image || item.thumbnail || 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500&auto=format&fit=crop&q=60',
              summary: item.summary || item.description || 'Acclaimed title available for streaming.',
              trailer: item.trailer || item.streamUrl || `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(item.title || 'movie trailer')}`
            }));
            filterCatalog();
          }
        }
      } catch (err) {
        console.error('Using built-in streaming catalog:', err);
      }
    }

    function renderCatalog(items) {
      const grid = document.getElementById('movieGrid');
      if (!items.length) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color:#9ca3af; padding:2rem;">No matching titles found.</div>';
        return;
      }
      grid.innerHTML = items.map(m => `
        <div class="movie-card" onclick="watchMovie('${m.title.replace(/'/g, "\\'")}')">
          <img src="${m.poster}" class="movie-poster" alt="${m.title}">
          <div class="movie-info">
            <div>
              <div class="movie-title">${m.title}</div>
              <div class="movie-meta">
                <span>${m.year} • ${m.category}</span>
                <span class="rating"><i class="fas fa-star"></i> ${m.rating}</span>
              </div>
            </div>
            <button class="watch-btn" onclick="event.stopPropagation(); watchMovie('${m.title.replace(/'/g, "\\'")}')"><i class="fas fa-play"></i> Watch Now</button>
          </div>
        </div>
      `).join('');
    }

    function setCategory(cat, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = cat;
      filterCatalog();
    }

    function filterCatalog() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = catalog.filter(m => {
        const matchesCat = currentCategory === 'all' || m.category === currentCategory;
        const matchesQuery = m.title.toLowerCase().includes(query) || m.summary.toLowerCase().includes(query);
        return matchesCat && matchesQuery;
      });
      renderCatalog(filtered);
    }

    function watchMovie(title) {
      const movie = catalog.find(m => m.title === title) || { title, summary: 'Now streaming in high definition.', trailer: `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(title)}`, rating: 8.5, year: 2024 };
      document.getElementById('modalTitle').innerText = movie.title;
      document.getElementById('moviePlayer').src = movie.trailer || `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(movie.title)}`;
      document.getElementById('modalSummary').innerHTML = `<strong>${movie.title} (${movie.year})</strong> • Rating: ⭐ ${movie.rating}/10<br><br>${movie.summary}`;
      document.getElementById('playerModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('playerModal').style.display = 'none';
      document.getElementById('moviePlayer').src = '';
    }

    renderCatalog(catalog);
    loadLiveCatalog();
  </script>
</body>
</html>
