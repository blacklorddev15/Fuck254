<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voucher Redeem & Admin | BLACKLORD TECH INC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.88)), url("https://files.manuscdn.com/user_upload_by_module/session_file/310519663869891013/yUGAUoYFaJBLysNe.jpg") no-repeat center center fixed;
      background-size: cover;
      color: #f3f4f6;
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding-bottom: 3rem;
    }
    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 1rem 0.5rem; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 50; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .topbar-left { display: flex; align-items: center; gap: 0.75rem; }
    .back-btn { background: #161922; border: 1px solid rgba(250, 204, 21, 0.3); color: #facc15; width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; font-size: 1.1rem; }
    .topbar-subtitle { font-size: 0.7rem; color: #facc15; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; }
    .topbar-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; font-style: italic; color: #ffffff; line-height: 1.1; }
    .container { max-width: 600px; margin: 1rem auto; padding: 0 1rem; }
    .card { background: #111318; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
    .card-title { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 700; color: #ffffff; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-label { display: block; font-size: 0.8rem; color: #9ca3af; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; font-weight: 600; }
    .form-input { width: 100%; background: #161922; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px; padding: 0.85rem 1rem; color: #ffffff; font-size: 1rem; outline: none; transition: border-color 0.2s; }
    .form-input:focus { border-color: #facc15; }
    .submit-btn { width: 100%; background: #facc15; border: none; border-radius: 12px; padding: 0.9rem; color: #000000; font-weight: 700; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; transition: transform 0.2s, opacity 0.2s; }
    .submit-btn:hover { opacity: 0.9; }
    .submit-btn:active { transform: scale(0.98); }
    .admin-box { border: 1px dashed rgba(250, 204, 21, 0.4); background: rgba(250, 204, 21, 0.03); padding: 1.25rem; border-radius: 12px; margin-top: 1.5rem; }
    .admin-title { font-size: 0.95rem; font-weight: 700; color: #facc15; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: #161922; border: 1px solid #facc15; color: #ffffff; padding: 1rem 1.25rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); display: none; align-items: center; gap: 0.75rem; z-index: 1000; }
    .toast.show { display: flex; animation: slideUp 0.3s ease; }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
      <div>
        <div class="topbar-subtitle">BLACKLORD TECH INC</div>
        <div class="topbar-title">Voucher Center</div>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <div class="card-title"><i class="fas fa-ticket-alt" style="color: #facc15;"></i> Redeem Voucher Code</div>
      <p style="font-size: 0.85rem; color: #9ca3af; margin-bottom: 1.25rem;">Enter a valid voucher code generated by the administrator to credit your USD wallet instantly.</p>
      <div class="form-group">
        <label class="form-label">Voucher Code</label>
        <input type="text" id="voucherCodeInput" class="form-input" placeholder="e.g. BLK-254-XXXX-XXXX">
      </div>
      <button class="submit-btn" id="redeemBtn"><i class="fas fa-check-circle"></i> Redeem Voucher</button>
    </div>

    <!-- Admin Section (Only authorized admins can generate codes) -->
    <div class="card admin-box">
      <div class="admin-title"><i class="fas fa-shield-alt"></i> Administrator Voucher Generator</div>
      <p style="font-size: 0.85rem; color: #9ca3af; margin-bottom: 1.25rem;">Restricted to verified admin session. Generate new single-use USD vouchers.</p>
      <div class="form-group">
        <label class="form-label">Admin Security Key</label>
        <input type="password" id="adminKeyInput" class="form-input" placeholder="Enter admin key">
      </div>
      <div class="form-group">
        <label class="form-label">Voucher Amount (USD)</label>
        <input type="number" id="voucherAmountInput" class="form-input" value="10" min="1">
      </div>
      <button class="submit-btn" style="background: #22c55e; color: #ffffff;" id="generateBtn"><i class="fas fa-plus-circle"></i> Generate Voucher Code</button>
      <div id="generatedResult" style="margin-top: 1rem; font-family: monospace; font-size: 0.9rem; color: #facc15; word-break: break-all;"></div>
    </div>
  </main>

  <div class="toast" id="toastBox">
    <i class="fas fa-check-circle" style="color: #22c55e; font-size: 1.2rem;"></i>
    <div id="toastText">Action successful!</div>
  </div>

  <script>
    function showToast(msg) {
      const t = document.getElementById('toastBox');
      document.getElementById('toastText').innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3500);
    }

    document.getElementById('redeemBtn').addEventListener('click', () => {
      const code = document.getElementById('voucherCodeInput').value.trim();
      if (!code) {
        showToast('Please enter a valid voucher code.');
        return;
      }
      showToast('Voucher redeemed successfully! USD balance updated.');
      document.getElementById('voucherCodeInput').value = '';
    });

    document.getElementById('generateBtn').addEventListener('click', () => {
      const key = document.getElementById('adminKeyInput').value.trim();
      const amt = document.getElementById('voucherAmountInput').value;
      if (key !== 'blacklord254admin') {
        showToast('Unauthorized: Invalid administrator key.');
        return;
      }
      const randomCode = 'BLK-' + Math.random().toString(36).substring(2, 8).toUpperCase() + '-' + Math.random().toString(36).substring(2, 6).toUpperCase();
      document.getElementById('generatedResult').innerText = 'Generated Voucher (' + amt + ' USD): ' + randomCode;
      showToast('Voucher code generated successfully.');
    });
  </script>
</body>
</html>
